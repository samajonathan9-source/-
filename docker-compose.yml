version: "3.8"

# RATISS One — deploiement du serveur API.
# Le modele est monte en volume pour eviter de reconstruire l'image
# a chaque mise a jour des poids.

services:
  ratis:
    build:
      context: .
      dockerfile: ratiss_skynet/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RATIS_MODEL_DIR=/app/models/RATISS-One
      - PORT=8000
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
